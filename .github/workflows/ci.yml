name: ci

on:
  push:
  pull_request:

jobs:
  # Git for Windows checks files out with CRLF by default; .gitattributes keeps them LF, so the recorded
  # replay's hashes match. This job proves it on a Windows runner.
  windows:
    runs-on: windows-latest
    steps:
      - run: git config --global core.autocrlf true
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - run: npm ci
      - run: npm --prefix web ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm --prefix web run typecheck
      - run: npm test
      # Several agents must have model requests outstanding at the same time, or this fails.
      - run: npm run prove
      # The Verifier must reject an injected misread and the totals must still be right.
      - run: npm run demo:catch
      - run: npm run check:licenses
      # Pipeline evaluation with the deterministic test model; fails if any figure is shown without a
      # source or a wrong figure gets verified.
      - run: npm run eval -- --mode fake
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
